[project]
name = "artificiellalecta"
version = "0.1.0"
description = "Simulerat tjänstepensionsbolag för ITP1 ålderspension"
requires-python = ">=3.11"
dependencies = [
    # <2.1: SQLAlchemy 2.1 byter standarddrivrutin för postgresql:// till psycopg (v3);
    # projektet använder psycopg2-binary mot Lakebase (DATABASE_URL utan +drivrutin)
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    # AI-abstraktionslagret (src/ai/, B-025): bara leverantörernas
    # officiella SDK:er. Övre gräns på major-version – uppgraderas medvetet
    # och verifieras med scripts/smoke_test_ai.py.
    "anthropic>=1.13,<2",
    "openai>=3.28,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai = ["*.yaml"]
services = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
