[project]
name = "artificiellalecta"
version = "0.1.0"
description = "Simulerat tjänstepensionsbolag för ITP1 ålderspension"
requires-python = ">=3.11"
dependencies = [
    # <2.1: SQLAlchemy 2.1 byter standarddrivrutin för postgresql:// till psycopg (v3);
    # projektet använder psycopg2-binary mot Lakebase (DATABASE_URL utan +drivrutin)
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    # AI-abstraktionslagret (src/ai/, B-025): bara leverantörernas
    # officiella SDK:er. Övre gräns på major-version – uppgraderas medvetet
    # och verifieras med scripts/diagnostics/smoke_test_ai.py.
    "anthropic>=1.13,<2",
    "openai>=3.28,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Handläggar-UI:t (src/web/, Fas 4): serverrenderade sidor med HTMX –
    # inget Node och inget byggsteg. Bara lokalt (127.0.0.1).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Rapportmall och vektordiagram i Digital klarhet (src/reporting/).
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    # FastAPI:s TestClient (starlette.testclient) bygger på httpx2
    "httpx2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai = ["*.yaml"]
design = ["*.json"]
services = ["*.yaml"]
web = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
