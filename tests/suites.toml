[suites.tooling]
description = "Körverktyg, testkatalog och ändringsstyrt urval"
status = "active"
tests = ["tests/test_script_entrypoints.py", "tests/test_test_selection.py"]
dependents = []

# Filselektorer gäller alla testfall i filen; ::funktion gäller också parametriseringar.
[markers]
postgres = [
  "tests/test_services_postgres.py", "tests/test_agents_postgres_role.py",
  "tests/test_migration_cases.py::test_migrationen_skapar_bara_cases_och_blir_identisk_med_create_all",
  "tests/test_product_parameters.py::test_migrationen_skapar_fyller_och_raknar_om_identiskt",
  "tests/test_product_parameters.py::test_migrationen_rullas_tillbaka_vid_avvikande_premie",
  "tests/test_migration_flows.py::test_migrationen_skapar_bara_flodestabellerna_och_blir_identisk_med_create_all",
]
integration = ["tests/test_services_postgres.py", "tests/test_agents_postgres_role.py", "tests/test_services_transactions.py", "tests/test_web_cases.py", "tests/test_agents_case_runs.py", "tests/test_backup.py", "tests/test_migration_cases.py", "tests/test_product_parameters.py", "tests/test_portfolio_impact.py", "tests/test_agents_teams.py", "tests/test_agents_flow_rule_change.py", "tests/test_web_flows.py"]
security = ["tests/test_services_access.py", "tests/test_services_transactions.py", "tests/test_agents_dispatcher.py", "tests/test_agents_ecosystem.py", "tests/test_agents_gateways.py", "tests/test_agents_journal.py", "tests/test_agents_skills.py", "tests/test_agents_postgres_role.py", "tests/test_ai_boundaries.py", "tests/test_portfolio_impact.py::TestIngaIndividuppgifter", "tests/test_portfolio_impact.py::TestAtkomst", "tests/test_agents_teams.py::TestGatewayverktyg", "tests/test_agents_teams.py::TestParametermandatet"]

# Alla matchande regler förenas. dependents utvidgar sedan kodändringens urval transitivt.
[[rules]]
paths = [
  "tests/conftest.py", "tests/__init__.py", "tests/suites.toml", "tests/flow_helpers.py",
  "tests/test_agents_loop.py", "tests/test_services_postgres.py", "tests/test_services_transactions.py",
  "tests/test_services_write_ops.py", "tests/test_services_enrollment.py", "tests/test_web_changes.py",
  "pyproject.toml", "src/models/**", "src/testing/**", "scripts/testing/**", ".github/**",
]
full = true

[[rules]]
paths = ["src/skills/calculation/**", "src/services/parameters.py", "src/services/operations/premiums.py", "src/services/operations/salary.py", "src/services/operations/corrections.py", "src/services/operations/product_parameters.py"]
suites = ["premiums"]

[[rules]]
paths = ["src/services/**"]
suites = ["services", "insurance", "premiums", "insights", "data"]

[[rules]]
paths = ["src/ai/**"]
suites = ["ai"]

[[rules]]
paths = ["src/agents/**", "02_system/agenter/**", "04_regulatoriskt/**"]
suites = ["agents"]

[[rules]]
paths = ["src/web/**", "scripts/web/start_ui.py", "scripts/web/open_ui.ps1", "scripts/web/install_desktop_shortcut.py"]
suites = ["web"]

[[rules]]
paths = ["src/analytics/**", "src/management/**", "scripts/analysis/**"]
suites = ["insights"]

[[rules]]
paths = ["src/reporting/**", "scripts/documentation/build_agent_usage_example.py", "06_design/exempel/**", "output/pdf/**"]
suites = ["reporting"]

[[rules]]
paths = ["src/design/**", "scripts/web/build_design_tokens.py"]
suites = ["design"]

[[rules]]
paths = ["src/utils/backup.py", "src/utils/migration*.py", "scripts/migrations/**", "scripts/maintenance/**"]
suites = ["data", "tooling"]

[[rules]]
paths = ["src/utils/db.py", "src/utils/agent_roles.py", "src/utils/demo_data.py", "scripts/setup/**", "scripts/demo/**"]
suites = ["services", "insurance", "premiums", "agents", "web", "data", "tooling"]

[[rules]]
paths = ["scripts/diagnostics/**", "scripts/smoke_test_ai.py"]
suites = ["ai", "agents", "tooling"]

[[rules]]
paths = ["scripts/documentation/list_operations.py", "02_system/tjänstelager_operationer.md"]
suites = ["services", "tooling"]

[[rules]]
paths = ["scripts/documentation/list_skills.py", "scripts/documentation/show_agent_profile.py", "03_skills/**"]
suites = ["agents", "tooling"]

[[rules]]
paths = ["01_domän/**"]
suites = ["premiums", "services", "agents", "web", "insights", "data", "tooling"]

# Framtida kodområden: välj inte bort bristen på tester om kod börjar läggas här.
[[rules]]
paths = ["src/pensions/**"]
suites = ["pensions"]

[[rules]]
paths = ["src/payments/**"]
suites = ["payments"]

[[rules]]
paths = ["src/accounting/**"]
suites = ["economy"]

[[rules]]
paths = ["src/risk/**"]
suites = ["risk"]

[[rules]]
paths = ["src/simulation/**"]
suites = ["simulation"]

[[rules]]
paths = ["src/compliance/**"]
suites = ["compliance"]

[[rules]]
paths = ["src/communication/**"]
suites = ["communication"]

[[rules]]
paths = ["src/agents/flows/**"]
suites = ["orchestration"]

# Produkt-/käll-/instruktionsfiler ovan behandlas som systemindata även om de är Markdown.
[[rules]]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "MASTER_CONTEXT.md", "BESLUTSLOGG.md", "ATT_GORA.md", "DEMO_ANTECKNINGAR.md", "projekt/**", "02_system/**", "05_styrdokument/**", "06_design/**"]
documentation = true
