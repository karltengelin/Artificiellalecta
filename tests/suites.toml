status = "partial"
tests = ["tests/test_agents_flows.py", "tests/test_agents_flow_rule_change.py"]
dependents = ["agents", "web", "tooling"]

[suites.services]
description = "Gemensamma tjänstekontrakt, åtkomst och transaktioner"
status = "active"
tests = ["tests/test_services_access.py", "tests/test_services_contract.py", "tests/test_services_service.py", "tests/test_services_transactions.py", "tests/test_services_persistence.py", "tests/test_services_postgres.py", "tests/test_services_listing.py", "tests/test_services_operations.py", "tests/test_services_insured_listing.py", "tests/test_services_write_ops.py", "tests/test_services_cases.py", "tests/test_services_enrollment.py", "tests/test_product_parameters.py", "tests/test_product_parameter_changes.py", "tests/test_portfolio_impact.py"]
