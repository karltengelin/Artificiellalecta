# Verksamhetsområden följer målbilden; dependents och regler följer aktuell kod.
# Alla testfiler ska tillhöra minst en grupp. Överlapp är avsiktligt.
version = 1

[suites.insurance]
description = "Anställning, försäkring och ärenden"
status = "partial"
tests = ["tests/test_services_enrollment.py", "tests/test_services_cases.py", "tests/test_models_cases.py", "tests/test_services_operations.py", "tests/test_services_insured_listing.py"]
dependents = ["agents", "web", "tooling"]

[suites.premiums]
description = "Löneunderlag, premie och produktparametrar; fakturakedjan återstår"
status = "partial"
tests = ["tests/test_calculate_itp1_premium.py", "tests/test_product_parameters.py", "tests/test_product_parameter_changes.py", "tests/test_services_write_ops.py"]
dependents = ["services", "agents", "web", "insights", "data", "tooling"]

[suites.pensions]
description = "Pensionsplaner, garanti och kapitalavräkning"
status = "planned"
tests = []
