[suites.reporting]
description = "Rapportformat och exempel; formell verksamhetsrapportering återstår"
status = "partial"
tests = ["tests/test_reporting_template.py", "tests/test_reporting_agent_usage_example.py"]
dependents = []

[suites.insights]
description = "Beståndsanalys och scenario"
