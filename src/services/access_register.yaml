# Åtkomstregister för tjänstelagret (B-028). Specifikation: 02_system/tjänstelager.md §4.
#
# En rad per operation: vad en AGENT får göra med den.
#   AGENT       – agenten får utföra operationen direkt (om den finns i agentens skill-poddar)
#   APPROVAL    – agenten får föreslå; en handläggare måste godkänna innan den utförs
#   HUMAN_ONLY  – endast handläggare; operationen syns inte för agenter
#
# Handläggare får alltid utföra alla operationer (B-017).
#
# Golv som registret inte kan gå förbi:
#   - operation som saknas här                           -> HUMAN_ONLY
#   - external (påverkar omvärlden)                      -> minst APPROVAL
#   - write/external vars produktregel inte är godkänd   -> HUMAN_ONLY
#
# Ändra vad agenter får göra: ändra nivån på raden, committa och merga efter granskning.
# En rad för en operation som inte finns ger fel vid start (fångar stavfel).

operations:
  get_insured_overview: AGENT          # läsning, personuppgifter (loggas)
  get_premium_history: AGENT           # läsning, personuppgifter (loggas)
  get_salary_reports: AGENT            # läsning av löneunderlag, personuppgifter (loggas)
  calculate_premium_preview: AGENT     # beräkning enligt PR-ITP1-001, sparar ingenting
  get_product_parameters: AGENT        # produktparametrarna med versioner (B-035), inga personuppgifter
  schedule_product_parameter_change: APPROVAL    # ny parameterversion från en framtida månad (B-035); agenten föreslår
  withdraw_product_parameter_change: HUMAN_ONLY  # dra tillbaka en kommande version (B-035)

  # Godkännandekön och händelseloggen (Fas 4, handläggar-UI:t). Handläggarens kontrollyta:
  # agenter ser inte kön eller loggen (dataminimering, B-006) – kan öppnas genom en ändring här.
  list_approval_requests: HUMAN_ONLY   # förslag med indata och motivering, personuppgifter (loggas)
  count_approval_requests: HUMAN_ONLY  # antal per status, inga personuppgifter
  get_operation_events: HUMAN_ONLY     # händelseloggen, personuppgifter (loggas)

  # Skrivningar (Fas 1f T3). PR-ITP1 v1.0 är infört (B-031) men gäller först från 2026-11-01;
  # till dess ger regelgolvet HUMAN_ONLY för agenter oavsett nivån här – se 02_system/tjänstelager_operationer.md.
  register_salary_report: APPROVAL       # löneunderlag per månad, ny rapport eller rättelse (PR-ITP1-014)
  set_policy_paid_up: APPROVAL           # avanmälan + fribrev, ej startad pension (PR-ITP1-013)
  correct_premium_transaction: HUMAN_ONLY  # rättelse med motpost; negativ ändring avgörs av människa (PR-ITP1-019, -031)

  # Stamdata och anslutning (Fas 4 S5). Gäller också golvet: write utan godkänd regel -> HUMAN_ONLY.
  enroll_insured_person: APPROVAL        # ny anställd: person, försäkring, förmån, premiebetalande (PR-ITP1-012, -013)
  update_current_salary: HUMAN_ONLY      # aktuell lön är stamdata utan produktregel – inte löneunderlag (PR-ITP1-014)
  update_contact_details: HUMAN_ONLY     # e-post/telefon; byte är en väg till kontokapning – människa verifierar (PR-ITP1-031)
  register_employer: HUMAN_ONLY          # ny försäkringstagare = nytt avtal (PR-ITP1-012)
  list_employers: AGENT                  # referensdata utan kontaktpersoner

  # Ärenden (Fas 5 F5-2, B-033). Skrivningarna saknar produktregel och är HUMAN_ONLY även genom golvet;
  # harness skriver status efter en agentkörning som systemaktör.
  create_case: HUMAN_ONLY                # handläggaren registrerar ärendet (B-033 val B)
  get_case: AGENT                        # ärendet med inrapporterade uppgifter; harness begränsar till körningens ärende
  list_cases: HUMAN_ONLY                 # handläggarens arbetslista, personuppgifter (loggas)
  update_case_status: HUMAN_ONLY         # status, handläggare och senaste agentkörning
  close_case: HUMAN_ONLY                 # utfall; avslag och manuell prövning motiveras (PR-ITP1-031)

  # terminate_policy är uppskjuten: slutavräkning (PR-ITP1-027) och dödsfallsavräkning
  # (PR-ITP1-010) kräver uttagsdelar, månadsanspråk och kapitaljournal som modellen saknar.
