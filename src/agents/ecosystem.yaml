# Agentekosystemets körpolicy (Fas 3b-1). Design: 02_system/harness.md §3, agentekosystem.md §3–5.
#
# En samlad fil för team, agenter, skill-poddar och gränser – den enda källan för vad en
# agent får se och anropa. Agentens Markdown-instruktion ger inga befogenheter.
#
# Effektiva verktyg för en agent = snittet av allt nedan, och ett nej vinner alltid:
#   - skillen hör till exakt en podd, och podden är monterad på teamet och agenten
#   - skillen är inte nekad globalt, för teamet, agenten eller uppdraget
#   - skillens sidoeffekt finns i alla tillåtna mängder (defaults, podd, team, agent, uppdrag)
#   - tjänstelagrets effektiva nivå (access_register.yaml + golven) är inte HUMAN_ONLY
# Agentnivån (AGENT/APPROVAL/HUMAN_ONLY) står bara i tjänstelagrets åtkomstregister – aldrig här.
#
# Ändras genom granskad merge. Ingen agent skriver den här filen.
# Visa effektiv profil: python scripts/documentation/show_agent_profile.py case_handler

schema_version: 1
policy_id: harness-v1

# B-026:s sju team. Namn som får användas som ägare, montering och delegeringsmål,
# även innan teamet har en aktiv profil under `teams`.
team_ids: [forsakring, kommunikation, kapital, aktuarie, compliance, ekonomi, utveckling]

defaults:
  deny_skills: []
  allowed_effects: [read, compute, write]   # external öppnas aldrig här (§3.5, B-026)
  require_execution_scope_for_pii: true
  # Globala tak för en enskild agent (harness.md §6.3). Team, agent och uppdrag får bara sänka.
  limits:
    max_steps: 20
    max_tool_calls: 30
    max_cost_usd: 2.00
    max_output_tokens: 12000   # höjt från 4000 efter röktestet 3c-V 2026-10-26 (tolkningar klipptes)
    max_context_bytes: 120000
    max_wall_seconds: 600

pods:
  # Kunddata via tjänstelagret. PII: kräver execution_scope i uppdraget (dispatchern prövar
  # varje anrop mot det) och en egen databasroll innan verktygen visas (harness.md §5.1).
  kunddata:
    owner_team: forsakring
    mountable_by: [forsakring]
    pii: true
    allowed_effects: [read, write]
    skills:
      get_insured_overview: {service_operation: get_insured_overview}
      get_premium_history: {service_operation: get_premium_history}
      get_salary_reports: {service_operation: get_salary_reports}
      get_case: {service_operation: get_case}             # bara körningens ärende (B-033)
      register_salary_report: {service_operation: register_salary_report}
      set_policy_paid_up: {service_operation: set_policy_paid_up}
      correct_premium_transaction: {service_operation: correct_premium_transaction}

  berakning:
    owner_team: aktuarie
    mountable_by: [forsakring, aktuarie, compliance]
    pii: false
    allowed_effects: [compute]
    skills:
      calculate_premium_preview: {service_operation: calculate_premium_preview}

  # Läsning av godkända regel- och källdokument via handtag (gatewayen regelverk, 3c-G) och
  # produktparametrarna med versioner. Innehållet är underlag, aldrig instruktion (harness.md §5.2).
  regelverk:
    owner_team: compliance
    mountable_by: [compliance, aktuarie]
    pii: false
    allowed_effects: [read]
    skills:
      list_regulatory_documents: {gateway_tool: list_regulatory_documents}
      read_regulatory_document: {gateway_tool: read_regulatory_document}
      get_product_parameters: {service_operation: get_product_parameters}

  # Markdown-utkast i körningens egen arbetsyta (gatewayen dokument, 3c-G). Ändrar aldrig
  # gällande dokument; operatören för in en regeländring själv (flaggskeppsflöde.md val H).
  dokument:
    owner_team: utveckling
    mountable_by: [compliance, aktuarie]
    pii: false
    allowed_effects: [write]
    skills:
      write_draft: {gateway_tool: write_draft}

  # Aggregat om beståndet i betrodd kod – ingen individdata (tjänstelager.md §9.5). Beståndsinsikten
  # räknar bara på den parameterändring som uppdragets godkända förslag anger (flaggskeppsflöde.md §5).
  bestand:
    owner_team: aktuarie
    mountable_by: [aktuarie]
    pii: false
    allowed_effects: [read]
    skills:
      estimate_parameter_change_impact: {service_operation: estimate_parameter_change_impact, parameter_mandate: true}
      # Registrerat bestånd och betalmarkerade premier per månad, utan mandat (OC-3a val C)
      get_company_metrics: {service_operation: get_company_metrics}

  # Delegering till ett annat teams ledande agent (3c-1, B-039). Harness kör barnet med egen profil
  # och gemensam rotbudget; verktyget visas bara när uppdraget anger delegation_targets.
  delegering:
    owner_team: utveckling
    mountable_by: [compliance]
    pii: false
    allowed_effects: [read]
    skills:
      delegate_to_team: {harness_tool: delegate_to_team}

teams:
  forsakring:
    lead: case_handler
    mandate: Utred tilldelade ITP1-ärenden och förbered administrativa åtgärder.
    pods: [kunddata, berakning]
    allowed_effects: [read, compute, write]
    deny_skills: [correct_premium_transaction]
    delegates_to: [kommunikation]
    limits:
      max_steps: 12
      max_tool_calls: 18
      max_cost_usd: 0.50
      max_output_tokens: 1500
      max_context_bytes: 40000
      max_wall_seconds: 180

  # Första avgränsade regel- och analysverktygen (B-035/B-037). Inga kundpersonuppgifter, inga skrivningar
  # i försäkringssystemet – write gäller bara utkast i körningens arbetsyta.
  compliance:
    lead: compliance_agent
    mandate: Tolka regelverksändringar till produktregler och parametrar med källor, konsekvenser och osäkerheter.
    pods: [regelverk, dokument, berakning, delegering]
    allowed_effects: [read, compute, write]
    delegates_to: [aktuarie]
    limits:
      max_steps: 16
      max_tool_calls: 30
      max_cost_usd: 1.50
      max_output_tokens: 12000
      max_context_bytes: 120000
      max_wall_seconds: 600

  aktuarie:
    lead: actuary_agent
    mandate: >-
      Ta fram beståndsinsikter i betrodd kod för godkända parameterändringar, med antaganden och begränsningar,
      samt aktuariell granskning och beräkningsunderlag på beställning av compliance.
    pods: [bestand, berakning, regelverk, dokument]
    allowed_effects: [read, compute, write]
    limits:
      max_steps: 12
      max_tool_calls: 16
      max_cost_usd: 1.00
      max_output_tokens: 12000
      max_context_bytes: 100000
      max_wall_seconds: 480

agents:
  case_handler:
    name: Handläggaragent
    team: forsakring
    instruction: 02_system/agenter/handlaggaragent.md
    model_role: standard
    pods: [kunddata, berakning]
    allowed_effects: [read, compute, write]
    deny_skills: [set_policy_paid_up]   # fribrevsförslag öppnas som eget användningsfall (§9.1)
    delegates_to: [kommunikation]

  compliance_agent:
    name: Compliance-agent
    team: compliance
    instruction: 02_system/agenter/compliance-agent.md
    model_role: deep
    pods: [regelverk, dokument, berakning, delegering]
    allowed_effects: [read, compute, write]
    delegates_to: [aktuarie]

  actuary_agent:
    name: Aktuarieagent
    team: aktuarie
    instruction: 02_system/agenter/aktuarieagent.md
    model_role: deep
    pods: [bestand, berakning, regelverk, dokument]
    allowed_effects: [read, compute, write]

# Delegering mellan team (3c-1, B-039). Gränserna gäller en hel rotkörning (harness.md §6.3, §10.2).
# Första aktiva paret är compliance → aktuarie; forsakring → kommunikation är ett namn utan aktiv profil.
delegation:
  enabled: true
  max_depth: 2
  max_children: 3
  root_limits:
    max_steps: 60
    max_tool_calls: 90
    max_cost_usd: 5.00
    max_wall_seconds: 900
